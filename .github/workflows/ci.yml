name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: Lint, type-check & build (extension)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install GNOME build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-bin gettext zip

      - run: npm ci

      - name: Lint
        run: npm run lint
        env:
          CI: 'true'

      - name: Type-check
        run: npm run type-check

      - name: Prettier
        run: npm run format:check

      - name: Build & pack
        run: npm run pack

      - name: Upload packaged extension
        uses: actions/upload-artifact@v4
        with:
          name: hibernate-windows-extension
          path: '*.shell-extension.zip'
          if-no-files-found: error

  shell:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck -x install.sh install/*.sh tests/vm/*.sh tests/vm/windows/*.sh
          shellcheck -s sh -e SC2016,SC2013 windows/wsl/os-switch-wsl

  core:
    name: Format, lint, test & build (os-switch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext

      - name: Check translations
        run: for f in crates/os-switch/po/*.po; do msgfmt -c -o /dev/null "$f"; done

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release

      - name: Upload os-switch
        uses: actions/upload-artifact@v4
        with:
          name: os-switch-x86_64-linux
          path: target/release/os-switch
          if-no-files-found: error

  release:
    name: Publish release
    needs: [extension, shell, core]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install GNOME build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-bin gettext zip

      - run: npm ci

      - name: Build & pack
        run: npm run pack

      - name: Build os-switch and bundle it with the installer
        run: |
          cargo build --release
          mkdir bundle
          cp -r install.sh install README.md LICENSE docs target/release/os-switch *.shell-extension.zip bundle/
          tar -czf "dual-boot-hibernation-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" -C bundle .
          # The Windows side as a zip of its own: that is where it gets unpacked.
          zip -r "dual-boot-hibernation-${GITHUB_REF_NAME}-windows.zip" windows

      - name: Create release and attach the bundle and the extension zip
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.shell-extension.zip
            dual-boot-hibernation-*.tar.gz
            dual-boot-hibernation-*-windows.zip
          generate_release_notes: true
